[pytest]
testpaths = tests
markers =
    smoke: Quick smoke tests for basic functionality
    customers: Tests related to Customer API
    payment_intents: Tests related to PaymentIntent API
    negative: Negative and input validation tests
    e2e: End-to-end payment flow tests
    security: Security-focused tests (injection, headers, HTTP methods)
    cross_resource: Cross-resource integration tests
    data_integrity: Data contract, encoding, and consistency tests
    refunds: Tests related to Refunds API
    resilience: Rate limit and resilience tests
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    -n auto
    --dist loadfile
    --reruns=2
    --reruns-delay=1
